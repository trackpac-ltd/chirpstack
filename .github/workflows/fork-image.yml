name: Fork image

on:
  push:
    branches: [build/oidc-image]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    if: github.repository == 'trackpac-ltd/chirpstack'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    env:
      CARGO_INCREMENTAL: 0
      DATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-26.05
      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: fork-image-amd64-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'cross/Dockerfile.x86_64-unknown-linux-musl') }}
      - name: Build UI
        run: nix-shell --command 'make build-ui'
      - name: Build AMD64 binary
        run: nix-shell --command 'cd chirpstack && make release-amd64'
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and load image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/Dockerfile.fork
          platforms: linux/amd64
          load: true
          tags: ghcr.io/trackpac-ltd/chirpstack:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Smoke test and publish
        env:
          IMAGE: ghcr.io/trackpac-ltd/chirpstack:sha-${{ github.sha }}
        run: |
          docker run --rm "$IMAGE" --version
          docker push "$IMAGE"
          DIGEST=$(docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}')
          echo "Pull by digest: \`$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
