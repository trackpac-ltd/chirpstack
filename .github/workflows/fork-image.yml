name: Fork image

on:
  push:
    branches: [build/oidc-image]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'trackpac-ltd/chirpstack'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-musl
          - arch: arm64
            target: aarch64-unknown-linux-musl
    permissions:
      contents: read
      packages: write
    env:
      CARGO_INCREMENTAL: 0
      DATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-26.05
      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: fork-image-${{ matrix.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'cross/Dockerfile.*') }}
      - name: Build UI
        run: nix-shell --command 'make build-ui'
      - name: Build binary
        env:
          TARGET: ${{ matrix.target }}
        run: nix-shell --command 'cd chirpstack && cross build --locked --target "$TARGET" --release --no-default-features --features=postgres'
      - name: Set up QEMU
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and load image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/Dockerfile.fork
          platforms: linux/${{ matrix.arch }}
          build-args: BINARY_PATH=target/${{ matrix.target }}/release/chirpstack
          load: true
          tags: ghcr.io/trackpac-ltd/chirpstack:sha-${{ github.sha }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Smoke test and publish
        env:
          IMAGE: ghcr.io/trackpac-ltd/chirpstack:sha-${{ github.sha }}-${{ matrix.arch }}
          PLATFORM: linux/${{ matrix.arch }}
        run: |
          docker run --rm --platform "$PLATFORM" "$IMAGE" --version
          docker push "$IMAGE"

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-platform image
        env:
          IMAGE: ghcr.io/trackpac-ltd/chirpstack:sha-${{ github.sha }}
        run: |
          docker buildx imagetools create --tag "$IMAGE" "$IMAGE-amd64" "$IMAGE-arm64"
          docker buildx imagetools inspect "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
